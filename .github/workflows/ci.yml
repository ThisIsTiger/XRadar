name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Verify (debug build + release build + tests + static checks)
        run: ./scripts/verify.sh

  test:
    name: XCTest suite
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run XCTest suite
        run: swift test --disable-sandbox
