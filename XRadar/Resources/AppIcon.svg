<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DA1F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D8BD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Radar circles -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="white" stroke-width="24" opacity="0.9"/>
  <circle cx="512" cy="512" r="180" fill="none" stroke="white" stroke-width="20" opacity="0.8"/>
  <circle cx="512" cy="512" r="80" fill="white" opacity="0.95"/>

  <!-- Radar sweep line -->
  <line x1="512" y1="512" x2="512" y2="232" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.9"/>

  <!-- Pulse dots -->
  <circle cx="712" cy="312" r="24" fill="white" opacity="0.9"/>
  <circle cx="312" cy="412" r="16" fill="white" opacity="0.7"/>
  <circle cx="612" cy="712" r="20" fill="white" opacity="0.8"/>
</svg>